#:schema node_modules/wrangler/config-schema.json

# Static website with one narrow Worker route: SvelteKit prerenders fixed routes
# into ./build; /garden-handoff/* serves the generated SPA fallback so arbitrary
# transfer IDs render the handoff page without exposing query parameters.

name = "seedkeep-web"
compatibility_date = "2026-07-25"
main = "./worker.js"

[assets]
directory = "./build"
binding = "ASSETS"
run_worker_first = ["/garden-handoff/*"]

[[routes]]
pattern = "seedkeep.app"
custom_domain = true

# The _headers file in build/ is honored automatically by Cloudflare's
# asset server, which is how the AASA file gets served as
# application/json instead of text/plain. No extra config needed here.

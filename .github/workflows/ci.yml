name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Xcode 16.x: ships Swift 6 + iOS 18.x simulator runtime.
      # macos-latest on GitHub Actions is macOS 15, which includes Xcode 16.2
      # by default; pinning here makes the version explicit and stable.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Generate Xcode project
        run: xcodegen generate

      # Fast host-side package tests (no simulator spin-up required).
      # SeedkeepKit declares .macOS(.v14) for exactly this path.
      - name: swift test (SeedkeepKit, host)
        run: swift test --package-path SeedkeepKit

      # Discover an available iPhone simulator at runtime (robust to the hosted
      # image's device-roster drift) and select it by UDID, then pre-boot it so
      # destination resolution can't be the failure point.
      - name: Pick + boot simulator
        id: pick_sim
        run: |
          set -euo pipefail
          LINE=$(xcrun simctl list devices available | grep -E "iPhone" | head -1)
          UDID=$(echo "$LINE" | grep -oE "[0-9A-Fa-f]{8}-[0-9A-Fa-f-]{27}")
          if [[ -z "$UDID" ]]; then
            echo "ERROR: no available iPhone simulator found" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Selected simulator: $LINE"
          xcrun simctl boot "$UDID" || true
          echo "SIM_UDID=$UDID" >> "$GITHUB_OUTPUT"

      # Diagnostic: print the destinations xcodebuild actually recognizes for the
      # scheme. Never fails the job — purely informational for log triage.
      - name: Show test destinations (diagnostic)
        run: |
          xcodebuild test -project Seedkeep.xcodeproj -scheme Seedkeep -showdestinations 2>&1 | tail -40 || true

      # Full iOS Simulator test run against the Seedkeep scheme, addressed by UDID.
      # CODE_SIGNING_ALLOWED/REQUIRED=NO: simulator tests need no signing identity.
      # Raw output is tee'd to a file (pretty-printed on success); on ANY failure
      # the next step dumps the raw tail so xcpretty can never hide the error.
      - name: xcodebuild test (iOS Simulator)
        env:
          SIM_UDID: ${{ steps.pick_sim.outputs.SIM_UDID }}
        run: |
          set -o pipefail
          NSUnbufferedIO=YES xcodebuild test \
            -project Seedkeep.xcodeproj \
            -scheme Seedkeep \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee xcodebuild-raw.log | xcpretty

      - name: Dump raw xcodebuild log on failure
        if: failure()
        run: |
          echo "=== last 150 lines of raw xcodebuild output ==="
          tail -150 xcodebuild-raw.log 2>/dev/null || echo "(no raw log captured)"
